[project]
name = "brahman-buddy"
version = "20261126.3"
license = "MIT"
license-files = ["LICENSE"]
description = "A personal work buddy: Telegram, Lark and Feishu chats driving Claude Code, with scheduled jobs, short and long stories, and portable skills"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark-oapi>=1.7.5",
    "segno>=1.6",  # the QR codes buddy init / buddy scan draw in the terminal (pure Python, no dependencies)
    "pycryptodome>=3.20",  # web push (webpush.py): P-256, ECDH, HKDF, AES-GCM; lark-oapi brings it already
    "httpx[http2]>=0.27",  # APNs (apns.py) speaks HTTP/2 only; httpx comes with lark-oapi, the extra adds h2 (pure Python)
]

[project.scripts]
buddy = "work_brahman.cli:main"
buddy-team = "work_brahman.entry:team"    # the team board (families/team): the same as buddy team
buddy-short = "work_brahman.entry:short"  # the short stories (families/short_story): the same as buddy short

[tool.uv.build-backend]
module-name = "work_brahman"  # the code keeps its name; the package on PyPI is brahman-buddy

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# UTF-8 everywhere (2026-11-19): a call that falls back to the locale's encoding (cp936 on a Chinese
# Windows) fails the suite. tests/conftest.py starts it under -X warn_default_encoding.
filterwarnings = ["error::EncodingWarning", "ignore::EncodingWarning:lark_oapi"]
