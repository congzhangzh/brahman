[project]
name = "brahman-buddy"
version = "0.2.6"
license = "MIT"
license-files = ["LICENSE"]
description = "A personal work buddy: Telegram, Lark and Feishu chats driving Claude Code, with scheduled jobs, short and long stories, and portable skills"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lark-oapi>=1.7.5",
]

[project.scripts]
buddy = "work_brahman.cli:main"

[tool.uv.build-backend]
module-name = "work_brahman"  # the code keeps its name; the package on PyPI is brahman-buddy

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
