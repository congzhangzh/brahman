# Written by the release kit into every release (brahman is never edited by hand).
# A tag v<version> builds the buddy as one executable on each OS (PyInstaller, Python inside,
# UTF-8 mode built in), runs a teammate's first steps with it on that OS, builds the wheel,
# and publishes one GitHub release with all of them and their SHA-256 sums.
#
# No artifacts: each job puts its file straight into a draft release (artifact storage is a
# quota shared by every private repo of the account; release files are not), and the draft
# is published only when every job passed. A failed run leaves a draft nobody downloads.
#
# PyPI (as freerdp-tk does it): trusted publishing, no token. Off until the repository
# variable PYPI_PUBLISH is "true" and pypi.org trusts this workflow (project brahman-buddy,
# workflow release.yml, environment pypi): a version on PyPI is public and can't be re-uploaded.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}  # a dry run: builds and tests, publishes nothing

permissions:
  contents: read

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "brahman-buddy ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md

  executable:
    needs: [draft]
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # an older glibc: the executable runs on more Linux systems
            asset: buddy-linux-x86_64
          - os: ubuntu-22.04-arm  # Linux on ARM64 (Raspberry Pi 5, Graviton, Ampere), native
            asset: buddy-linux-arm64
          - os: windows-latest
            asset: buddy-windows-x64.exe
          - os: windows-11-arm    # Windows on ARM (Snapdragon laptops, a Mac's VM), native, not x64 under Prism
            asset: buddy-windows-arm64.exe
          - os: macos-15          # Apple silicon
            asset: buddy-macos-arm64
          - os: macos-15-intel
            asset: buddy-macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # a hang fails in 20 minutes, not GitHub's 6 hours (a build takes 3-5)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Build
        shell: bash
        run: |
          uv venv --python 3.14 .venv-build
          bin=.venv-build/bin; [ "$RUNNER_OS" = Windows ] && bin=.venv-build/Scripts
          uv pip install --python .venv-build . pyinstaller
          printf 'from work_brahman.cli import main\nraise SystemExit(main())\n' > buddy_entry.py
          "$bin/pyinstaller" --onefile --name buddy --collect-data work_brahman --copy-metadata brahman-buddy \
            --python-option "X utf8" --noconfirm --distpath dist buddy_entry.py
      - name: Test, as a teammate would
        shell: bash
        run: |
          set -x
          b=dist/buddy; [ "$RUNNER_OS" = Windows ] && b=dist/buddy.exe
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          export HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" XDG_STATE_HOME="$home/.state"
          cfg="$home/.config/work_brahman/buddy.toml"
          # the version comes from the package metadata (importlib.metadata): PyInstaller ships it
          # only with --copy-metadata; without it the executable says "buddy n/a" (20261108.3)
          # the version from the tree, not the tag: a dry run (workflow_dispatch) has no tag
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          { "$b" || true; } | grep -q "^buddy $v"
          "$b" --help | grep -q "start here"
          "$b" init --yes --telegram-token 0:x --language en | grep -q wrote
          { "$b" init --yes --telegram-token 0:x 2>&1 || true; } | grep -q "already set up"  # refuses, exit 2
          "$b" allow tg:42 | grep -q "allowed tg:42"
          { "$b" doctor --offline || true; } | grep -q "a chat: Telegram"
          # exit 1 by design: a fake token, so no chat takes the card
          n=$({ "$b" short start ci --mark "CI ×?" || true; } | tail -1)
          "$b" short mark "$n" CI --status failed --note flaky > /dev/null
          "$b" short list | grep -q "⏳"
          "$b" service install --dry-run > /dev/null
          { "$b" || true; } | grep -q "checks ok"
          test -f "$cfg"
          # buddy setup (20261108.10 on): a dry run writes nothing, --yes writes the rules, and a
          # rerun has nothing to do (20261108.10 on Windows without symlinks re-copied every time)
          "$b" setup --no-pys | grep -q "rule brahman-git-roles"
          test ! -e "$home/.claude/rules"
          "$b" setup --yes --no-pys > /dev/null
          test -f "$home/.claude/rules/brahman-git-roles.md" && test -f "$home/.claude/rules/brahman-short-stories.md"
          "$b" setup --no-pys | grep -q "nothing to do"
      - name: The wheel on this OS, as uv installs it
        shell: bash
        run: |
          uv build --wheel --out-dir wheel
          # --python 3.14: a runner's own Python may be older (Windows has 3.12, 3.13), below the buddy's floor
          uv run --isolated --no-project --python 3.14 --with wheel/*.whl buddy --help | grep -q "start here"
      - name: Into the draft release, named for its platform
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=dist/buddy; [ "$RUNNER_OS" = Windows ] && src=dist/buddy.exe
          mkdir -p out && cp "$src" "out/${{ matrix.asset }}"
          gh release upload "$GITHUB_REF_NAME" "out/${{ matrix.asset }}" --clobber

  setup-with-pys:
    # buddy setup for real, beside pys: the wheel installed by uv; setup only looks for pys (it never
    # installs, moves or sets it up: 2026-11-10), so a missing pys is a warning with a hint; then
    # pys installed the way the hint says, found, and its own setup; the rules; on each kind of system
    needs: [draft]
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: buddy setup --yes, as a new user, then pys beside it
        shell: bash
        run: |
          set -x
          uv build --wheel --out-dir wheel
          uv tool install --python 3.14 wheel/*.whl
          export PATH="$(uv tool dir --bin):$PATH"
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          export HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" XDG_STATE_HOME="$home/.state"
          buddy setup | grep -q "not found: not installed by buddy setup"   # no pys: a warning
          buddy setup | grep -q "uv tool install py-screen"                 # and its hint
          buddy setup --yes
          if uv tool list | grep -q "^py-screen v"; then exit 1; fi           # setup installed none (`! cmd` never fails under set -e)
          test -e "$home/.claude/skills/pr-review"
          test -f "$home/.claude/rules/brahman-git-roles.md" && test -f "$home/.claude/rules/brahman-short-stories.md"
          # the way the hint says; uv puts it where tools go for this (new) user, not yet on PATH
          # (20261108.13's dry run looked before the HOME switch, and Linux and macOS did not find pys)
          uv tool install --python 3.14 py-screen
          buddy setup | grep -Eq "but not on PATH|pys .*found \("   # Linux, macOS: not on PATH; Windows found it before
          export PATH="$(uv tool dir --bin):$PATH"
          buddy setup | grep -q "pys .*found ("
          pys setup --yes
          pys --help | grep -q "usage: pys"
          test -e "$home/.claude/skills/pys-drive"
          # and then nothing of ours to do, and no warning: 20261108.10 relinked every run on
          # Windows (a link's text never matched its folder there)
          buddy setup | grep -q "nothing to do"
          if buddy setup | grep -q "warning"; then exit 1; fi

  wheel:
    needs: [draft]
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build --out-dir out  # the wheel and the sdist (PyPI takes both)
      - name: Into the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [executable, wheel, setup-with-pys]  # every platform passed, or this never runs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sums, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          gh release download "$GITHUB_REF_NAME"
          sha256sum * > SHA256SUMS && cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: [publish]  # only what was released here, after every platform passed
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist --pattern "*.whl" --pattern "*.tar.gz"
      - uses: pypa/gh-action-pypi-publish@release/v1
